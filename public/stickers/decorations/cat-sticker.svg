<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#cat-shadow)">
    <!-- White Die-Cut Background Silhouette -->
    <path d="M26 36 L16 16 C14 12, 28 20, 36 28 C41 26, 59 26, 64 28 C72 20, 86 12, 84 16 L74 36 C86 46, 88 66, 80 78 C70 92, 30 92, 20 78 C12 66, 14 46, 26 36 Z"
          fill="#FFFFFF" />
    <!-- Cat Head Base (Cream / Soft Warm Ivory) -->
    <path d="M28 38 L20 20 C19 17, 29 23, 37 30 C42 28, 58 28, 63 30 C71 23, 81 17, 80 20 L72 38 C82 48, 84 66, 76 76 C67 88, 33 88, 24 76 C16 66, 18 48, 28 38 Z"
          fill="#F5EDE4" stroke="#68151D" stroke-width="2.2" stroke-linejoin="round" />
    <!-- Inner Ears (Pink) -->
    <polygon points="23,24 28,34 35,32" fill="#F472B6" opacity="0.8" />
    <polygon points="77,24 72,34 65,32" fill="#F472B6" opacity="0.8" />
    <!-- Happy Closed Eyes -->
    <path d="M34 50 Q39 45 44 50" fill="none" stroke="#430D14" stroke-width="2.5" stroke-linecap="round" />
    <path d="M56 50 Q61 45 66 50" fill="none" stroke="#430D14" stroke-width="2.5" stroke-linecap="round" />
    <!-- Pink Cheeks -->
    <ellipse cx="32" cy="58" rx="5" ry="3" fill="#F87171" opacity="0.6" />
    <ellipse cx="68" cy="58" rx="5" ry="3" fill="#F87171" opacity="0.6" />
    <!-- Nose & Mouth -->
    <polygon points="48,56 52,56 50,59" fill="#E11D48" />
    <path d="M50 59 L50 63 Q46 67 42 64 M50 63 Q54 67 58 64" fill="none" stroke="#430D14" stroke-width="2" stroke-linecap="round" />
    <!-- Whiskers -->
    <line x1="20" y1="55" x2="30" y2="57" stroke="#430D14" stroke-width="1.5" stroke-linecap="round" />
    <line x1="20" y1="62" x2="29" y2="61" stroke="#430D14" stroke-width="1.5" stroke-linecap="round" />
    <line x1="80" y1="55" x2="70" y2="57" stroke="#430D14" stroke-width="1.5" stroke-linecap="round" />
    <line x1="80" y1="62" x2="71" y2="61" stroke="#430D14" stroke-width="1.5" stroke-linecap="round" />
    <!-- Little Birthday Bow/Hat on ear -->
    <path d="M72 16 L65 25 L80 27 Z" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="72" cy="15" r="2.5" fill="#FBBF24" />
  </g>
</svg>
