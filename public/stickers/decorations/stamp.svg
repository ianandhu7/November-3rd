<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Perforated Stamp Edge -->
  <rect x="5" y="5" width="90" height="110" rx="4" fill="#fdf8f0" stroke="#d5b99a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#stampShadow)" />
  <rect x="12" y="12" width="76" height="96" fill="#4a0e17" rx="2" />
  <!-- Stamp Art -->
  <circle cx="50" cy="50" r="24" fill="#801026" stroke="#e2c275" stroke-width="1.5"/>
  <text x="50" y="55" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" fill="#f4d06f" text-anchor="middle" font-weight="bold">LOVE</text>
  <text x="50" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#e2c275" text-anchor="middle" letter-spacing="2">PARIS • FOREVER</text>
  <text x="76" y="24" font-family="monospace" font-size="9" fill="#e2c275" text-anchor="end">№ 1103</text>
</svg>
