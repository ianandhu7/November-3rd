<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#badge-shadow)">
    <!-- White outer die-cut border -->
    <circle cx="50" cy="54" r="38" fill="#FFFFFF" />
    <!-- Scalloped or decorative edge rosette -->
    <circle cx="50" cy="54" r="35" fill="#881337" stroke="#D8B58A" stroke-width="2" stroke-dasharray="3,2" />
    <circle cx="50" cy="54" r="28" fill="#F4E8D5" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- Cute Birthday Party Hat on top left of the '2' -->
    <polygon points="34,14 26,34 44,32" fill="#E11D48" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Hat stripes -->
    <line x1="29" y1="28" x2="41" y2="26" stroke="#FBBF24" stroke-width="2" />
    <line x1="31" y1="22" x2="38" y2="20" stroke="#FFFFFF" stroke-width="1.5" />
    <!-- Hat pom-pom -->
    <circle cx="34" cy="13" r="3" fill="#FBBF24" />

    <!-- Number "20" -->
    <text x="36" y="63" font-family="'Playfair Display', serif" font-weight="900" font-size="28" fill="#68151D" text-anchor="middle">2</text>
    <text x="62" y="63" font-family="'Playfair Display', serif" font-weight="900" font-size="28" fill="#68151D" text-anchor="middle">0</text>

    <!-- Subtitle text or stars -->
    <text x="50" y="74" font-family="sans-serif" font-weight="700" font-size="6.5" fill="#881337" letter-spacing="1.2" text-anchor="middle">YEARS OF JOY</text>
    <circle cx="30" cy="72" r="1.2" fill="#D8B58A" />
    <circle cx="70" cy="72" r="1.2" fill="#D8B58A" />
  </g>
</svg>
