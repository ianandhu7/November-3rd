<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="sticker-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- White sticker die-cut border -->
  <g filter="url(#sticker-shadow)">
    <!-- Base Plate -->
    <ellipse cx="50" cy="85" rx="36" ry="6" fill="#F4E8D5" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Cake Base Layer -->
    <path d="M22 60 C22 56, 78 56, 78 60 L78 82 C78 87, 22 87, 22 82 Z" fill="#881337" stroke="#FFFFFF" stroke-width="2.5" />
    <path d="M22 60 C22 65, 78 65, 78 60" fill="none" stroke="#D8B58A" stroke-width="2" />
    <!-- Cake Top Layer -->
    <path d="M28 42 C28 38, 72 38, 72 42 L72 60 C72 64, 28 64, 28 60 Z" fill="#F4E8D5" stroke="#FFFFFF" stroke-width="2" />
    <!-- Cream drips -->
    <path d="M28 44 Q33 50 37 44 Q42 53 46 44 Q51 51 56 44 Q62 52 66 44 Q70 49 72 44" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Candles -->
    <!-- Left Candle -->
    <rect x="36" y="24" width="4" height="15" rx="1" fill="#E11D48" stroke="#FFFFFF" stroke-width="1" />
    <ellipse cx="38" cy="18" rx="2.5" ry="5" fill="#FBBF24" />
    <ellipse cx="38" cy="19" rx="1.2" ry="2.5" fill="#EF4444" />
    <!-- Middle Candle -->
    <rect x="48" y="20" width="4" height="19" rx="1" fill="#D8B58A" stroke="#FFFFFF" stroke-width="1" />
    <ellipse cx="50" cy="14" rx="3" ry="6" fill="#FBBF24" />
    <ellipse cx="50" cy="15" rx="1.5" ry="3" fill="#EF4444" />
    <!-- Right Candle -->
    <rect x="60" y="24" width="4" height="15" rx="1" fill="#E11D48" stroke="#FFFFFF" stroke-width="1" />
    <ellipse cx="62" cy="18" rx="2.5" ry="5" fill="#FBBF24" />
    <ellipse cx="62" cy="19" rx="1.2" ry="2.5" fill="#EF4444" />
    <!-- Cherries & Sprinkles -->
    <circle cx="43" cy="41" r="2" fill="#E11D48" />
    <circle cx="57" cy="41" r="2" fill="#E11D48" />
    <circle cx="50" cy="68" r="1.5" fill="#FBBF24" />
    <circle cx="36" cy="72" r="1.5" fill="#D8B58A" />
    <circle cx="64" cy="72" r="1.5" fill="#D8B58A" />
  </g>
</svg>
