    <title>A Day Made for You ♡ ✦ A Little Birthday Surprise</title>
    <meta name="description" content="A Day Made for You ♡ — November 3rd — a special day, because it's your birthday! I made this little website just for you, with some pictures, memories, and a few words I wanted to share." />
    
    <!-- Instant Theme Restore to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('museum_of_us_theme');
          var theme = (saved === 'midnight') ? 'midnight' : 'burgundy';
          document.documentElement.className = 'theme-' + theme;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Playfair Display, Sacramento, DM Sans, DM Mono -->
